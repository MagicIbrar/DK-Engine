<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="referrer" content="no-referrer"><title>Dekaron Online · Connect</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;color:#ede8df;background:#080d18}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 75% 20%,#33497155,transparent 55%),radial-gradient(ellipse at 20% 90%,#68502c33,transparent 60%),#080d18}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20% 30%,#ece6d788,transparent),radial-gradient(1px 1px at 70% 60%,#fff7,transparent);background-size:191px 173px,277px 237px}.card{position:relative;width:min(470px,calc(100vw - 36px));padding:44px;border:1px solid #ba996733;border-radius:20px;background:#101825ee;box-shadow:0 30px 120px #0008}.brand{font:18px Georgia,serif;letter-spacing:.19em;color:#e4c68c}.brand small{display:block;font:9px Segoe UI,sans-serif;letter-spacing:.6em;margin-top:8px;color:#a7b5cc}.eyebrow{font-size:10px;letter-spacing:.18em;color:#9dacbf;margin-top:44px}h1{font:36px/1.1 Georgia,serif;font-weight:normal;margin:12px 0 18px}.sub{color:#aab8ca;font-size:14px;line-height:1.7;margin-bottom:26px}label{display:block;font-size:12px;color:#ddd2be;margin:18px 0 8px}input{width:100%;border:1px solid #51617b;border-radius:8px;padding:14px;font:16px Segoe UI;background:#090f1b;color:white;outline:none}input:focus{border-color:#d7b777;box-shadow:0 0 0 3px #d7b77718}button{width:100%;margin-top:18px;padding:15px;border:1px solid #f2d795;border-radius:8px;background:linear-gradient(120deg,#e5c98b,#b99156);color:#171514;font:600 14px Segoe UI;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{min-height:22px;font-size:12px;color:#e8b19e;line-height:1.5;margin-top:15px}#details{font-size:11px;color:#96a8c2;overflow-wrap:anywhere}.foot{border-top:1px solid #293347;margin-top:20px;padding-top:20px;font-size:11px;line-height:1.7;color:#7f91aa}#host{color:#d2be99}@media(max-width:500px){.card{padding:30px}h1{font-size:32px}}@media(prefers-reduced-motion:no-preference){.card{animation:arrive .35s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}
[hidden]{display:none!important}#serverName{display:block;color:#d2be99;font-size:14px;margin-bottom:8px}#rates{display:block;margin-top:6px}.account-action{display:block;text-align:center;margin-top:18px;padding:14px;border:1px solid #d2be99;border-radius:8px;color:#e9d19d;text-decoration:none;font-size:14px}.account-action.primary{background:#ddc08b;color:#171514}.foot a{display:inline-block;color:#dfc693;margin-top:14px}#accountStatus{font-size:12px;color:#b8c9df;line-height:1.6;margin-top:15px}

</style></head><body><main class="card"><div class="brand">DEKARON<small>ONLINE</small></div><div class="eyebrow">JOIN A SHARED WORLD</div><h1 id="title">Checking this world…</h1><p class="sub" id="intro">Your account and characters belong to this server.</p><div id="details"><strong id="serverName"></strong><span id="host"></span><span id="rates"></span></div><form id="connect" hidden><label for="password">Server password</label><input id="password" name="server-password" type="password" autocomplete="off" required minlength="12" maxlength="128"><button id="submit" type="submit" disabled>Connect to server →</button><div id="status" role="status" aria-live="polite"></div></form><div id="accounts" hidden><a id="signin" class="account-action primary">Sign in</a><a id="signup" class="account-action">Create account</a></div><button id="retry" type="button" hidden>Retry session check</button><p id="accountStatus" role="status" aria-live="polite"></p><div class="foot">Your characters and progress belong to this server.<br>The host supplies this world's current game version and rules.<br><a id="servers" href="/web/public/index.html">← Choose another world</a></div></main><script type="module" src="/web/public/join.js"></script></body></html>
