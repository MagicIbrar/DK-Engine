<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Dekaron Online · Opening your world</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;color:#eee5d7;background:#080d18}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 70% 15%,#354b7555,transparent 60%),radial-gradient(ellipse at 10% 90%,#86613733,transparent 65%),#080d18}.card{width:min(440px,calc(100vw - 36px));padding:48px 36px;text-align:center;border:1px solid #ba99672b;border-radius:22px;background:#101825d9;box-shadow:0 30px 100px #0006}.brand{font:22px Georgia,serif;letter-spacing:.2em;color:#e4c68c}.brand small{display:block;margin-top:10px;font:10px Segoe UI,sans-serif;letter-spacing:.65em;color:#96abc8}h1{font:26px Georgia,serif;font-weight:normal;margin-top:40px}p{color:#aab8ca;font-size:13px;line-height:1.7;overflow-wrap:anywhere}.trail{height:4px;margin:28px 0;border-radius:99px;overflow:hidden;background:#263246}.trail:after{content:"";display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,transparent,#c4dcff,#f4d69b,transparent);animation:travel 1.1s ease-in-out infinite}.failed .trail:after{animation:none;width:100%;background:#b59568}@keyframes travel{from{transform:translateX(-100%)}to{transform:translateX(350%)}}@media(prefers-reduced-motion:reduce){.trail:after{animation:none;width:100%}}
</style>
</head>
<body><main class="card"><div class="brand">DEKARON<small>ONLINE</small></div><h1 id="title">Opening your world.</h1><p id="status" role="status" aria-live="polite">Finishing your launcher sign-in…</p><div class="trail" aria-hidden="true"></div><p id="host"></p></main>
<script>
// The fragment is never sent to this server or forwarded in a Referer. Remove it before any request.
(async function openLauncherSession(){
  const fragment=new URLSearchParams(location.hash.slice(1));
  const ticket=fragment.get('ticket');
  const desktop=new URLSearchParams(location.search).get('client')==='desktop';
  // Dekaron.exe (shell=native): the native DX11 client window
  const native=new URLSearchParams(location.search).get('shell')==='native';
  history.replaceState(null,'',location.pathname+location.search);
  document.getElementById('host').textContent=location.host;
  try{
    if(fragment.size!==1||!ticket||!/^[a-f0-9]{64}$/.test(ticket))throw new Error('Return to the launcher and choose Sign in & play.');
    const response=await fetch('/api/auth/launch-redeem',{method:'POST',credentials:'same-origin',cache:'no-store',redirect:'error',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket})});
    const result=await response.json();
    if(!response.ok||typeof result.id!=='string'||!/^[a-z0-9_-]{3,32}$/.test(result.id))throw new Error(result.error||'This sign-in expired. Return to the launcher and sign in again.');
    const verified=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store',redirect:'error'});
    const account=await verified.json();
    if(!verified.ok||account.id!==result.id)throw new Error('The game could not retain this sign-in. Check the server address and HTTPS settings in the launcher.');
    // every client (DX11 Client, Desktop App, Web Browser) opens the login hall with its server button, already signed in
    // (every version takes you to the login gate); gate=1 = enter with this session
    const next=new URL('/',location.origin);next.searchParams.set('gate','1');
    if(desktop)next.searchParams.set('client','desktop');
    if(native)next.searchParams.set('shell','native');
    location.replace(next.pathname+next.search);
  }catch(error){
    globalThis.__dkStartupLoad={fraction:0,ready:false,failed:true};
    document.body.classList.add('failed');
    document.getElementById('title').textContent='Return to your launcher.';
    document.getElementById('status').textContent=error instanceof TypeError?'The server could not be reached. Reconnect from the launcher.':error.message;
  }
})();
</script></body></html>
