<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forum &mdash; Dekaron Online</title>
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<header class="site-header"><div class="header-inner">
<a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">D</span><span>Dekaron <small>ONLINE</small></span></a>
<nav class="site-nav" aria-label="Main navigation"><a href="index.html">Discover</a><a href="forums.html">Community</a><a href="downloads.html">Downloads</a><a href="rankings.html">Rankings</a></nav>
<div class="header-auth" id="headerAuth"></div><a class="btn btn-play" href="/">Play Now <span aria-hidden="true">↗</span></a>
</div></header>

<main id="main-content">
  <section class="wrap">
    <div class="breadcrumb"><a href="forums.html">Forums</a> &rsaquo; <span id="categoryName">&hellip;</span></div>
    <div class="section-head">
      <h2 id="categoryTitle">&hellip;</h2>
      <button id="newThreadBtn" class="btn btn-gold" style="display:none;">New Thread</button>
    </div>

    <div id="newThreadPanel" class="panel panel-pad" style="display:none; margin-bottom:24px;">
      <div id="formMsg" class="form-msg"></div>
      <form id="newThreadForm" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" maxlength="120" required>
        </div>
        <div class="field">
          <label for="body">Message</label>
          <textarea id="body" name="body" maxlength="8000" required></textarea>
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn-gold">Post Thread</button>
          <button type="button" id="cancelNewThread" class="btn btn-ghost">Cancel</button>
        </div>
      </form>
    </div>

    <div id="loginPrompt" class="panel panel-pad" style="display:none; margin-bottom:24px; text-align:center;">
      <p style="margin:0;"><a href="login.html">Log in</a> or <a href="signup.html">sign up</a> to start a new thread.</p>
    </div>

    <div id="threadList" class="thread-list">
      <div class="skeleton">Loading threads&hellip;</div>
    </div>
  </section>
</main>

<footer class="site-footer"><div class="wrap"><a class="brand" href="index.html">DEKARON <small>ONLINE</small></a><p>A fan-made recreation for personal use.<br>Original artwork belongs to its respective owners.</p><div class="foot-links"><a href="forums.html">Community</a><a href="downloads.html">Downloads</a><a href="account.html">My Account</a></div></div></footer>

<script type="module" src="js/site.js"></script>
<script type="module" src="js/forum-category.js"></script>
</body>
</html>
